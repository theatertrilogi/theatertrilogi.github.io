<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theater</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        :root {
            --color-bg: #ffffff;
            --color-panel: #2a2a35;
            --color-available: #2e7d32;
            /* Green if available */
            --color-selected: #fbc02d;
            /* Yellow if selected */
            --color-occupied: #c62828;
            /* Red if occupied */
            --color-text: #ffffff;
            --color-text-muted: #a4b0be;
            --color-stage: #000000;
        }

        html,
        body {
            overflow: auto;
            scrollbar-width: none;
            /* Firefox */
            -ms-overflow-style: none;
            /* IE & Edge lama */
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari, Edge */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 24px;
            letter-spacing: 1px;
            text-align: center;
            color: #cd9f2a;
        }

        .subtitle {
            color: #787c4b;
            font-size: 14px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Legend */
        .legend {
            display: flex;
            gap: 20px;
            background: var(--color-panel);
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        /* Theater Stage Wrapper */
        .theater-stage-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            position: relative;
            padding: 0 100px;
        }

        /* Container Baru untuk menyejajarkan Entrance dan Stage */
        .stage-area-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            margin-bottom: 50px;
        }

        /* Entrance sekarang relative terhadap container barunya */
        .entrance {
            position: absolute;
            left: 0;
            width: 80px;
            height: 40px;
            border: 2px dashed #ff5252;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #ff5252;
            font-weight: bold;
            border-radius: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        /* Theater Stage */
        .stage {
            width: 100%;
            max-width: 400px;
            height: 25px;
            background: var(--color-stage);
            border-radius: 4px;
            box-shadow: 0 8px 25px rgba(210, 204, 192, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stage-text {
            font-size: 12px;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* Theater Container */
        .theater-container {
            display: flex;
            align-items: flex-start;
            gap: 40px;
            padding: 15px 55px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .block {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        /* Seat Styling */
        .seat {
            width: 35px;
            height: 35px;
            border-radius: 6px 6px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .seat.available {
            background-color: var(--color-available);
        }

        .seat.available:hover {
            transform: scale(1.1);
            box-shadow: 0 0 8px rgba(46, 125, 50, 0.6);
        }

        .seat.selected {
            background-color: var(--color-selected);
            color: #000;
        }

        /* Occupied seat style */
        .seat.occupied {
            background-color: var(--color-occupied);
            color: #fff;
        }

        .seat.occupied:hover {
            transform: scale(1.1);
            box-shadow: 0 0 8px rgba(198, 40, 40, 0.6);
        }

        /* Area kontainer bawah dengan 3 kolom agar panel konfirmasi tetap pas di tengah */
        .bottom-control-area {
            display: grid;
            grid-template-columns: 160px 1fr 160px;
            align-items: flex-end;
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
            gap: 20px;
        }

        /* Elemen kosong sebagai penyeimbang layout di kiri */
        .bottom-spacer {
            width: 100%;
        }

        /* Action Panel */
        .action-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            background: var(--color-panel);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .stats {
            font-size: 15px;
            text-align: center;
            line-height: 1.6;
        }

        .stats span {
            font-weight: bold;
            color: var(--color-selected);
        }

        .btn-container {
            display: flex;
            width: 100%;
            max-width: 300px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Tombol Confirm (Biru) */
        .btn-confirm {
            background-color: #3867d6;
            color: white;
        }

        .btn-confirm:hover {
            background-color: #4b7bec;
        }

        /* Tombol Reset (Merah) */
        .btn-reset {
            background-color: var(--color-occupied);
            color: white;
            white-space: nowrap;
        }

        .btn-reset:hover {
            background-color: #e74c3c;
        }

        /* Kustomisasi tema gelap untuk SweetAlert2 */
        .swal2-popup {
            background: #2a2a35 !important;
            color: #ffffff !important;
        }

        .swal2-title,
        .swal2-html-container {
            color: #ffffff !important;
        }
    </style>
</head>

<body>

    <h1>THEATER SEAT</h1>
    <div class="subtitle">MORE THAN A PERFORMANCE</div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-box" style="background-color: var(--color-available);"></div>
            <span>Available</span>
        </div>
        <div class="legend-item">
            <div class="legend-box" style="background-color: var(--color-selected);"></div>
            <span>Selected</span>
        </div>
        <div class="legend-item">
            <div class="legend-box" style="background-color: var(--color-occupied);"></div>
            <span>Occupied</span>
        </div>
    </div>

    <div class="theater-stage-wrapper">
        <div class="stage-area-container">
            <div class="entrance">
                <span>MAIN</span>
                <span>ENTRANCE</span>
            </div>

            <div class="stage">
                <div class="stage-text">MAIN STAGE</div>
            </div>
        </div>

        <div class="theater-container">
            <div class="block" id="block-left"></div>
            <div class="block" id="block-right"></div>
        </div>
    </div>

    <div class="bottom-control-area">
        <div class="bottom-spacer"></div>

        <div class="action-panel">
            <div class="stats">
                Currently selected seats: <span id="selected-count">0</span><br>
                Total occupied seats (Red): <span id="occupied-count">0</span> / 72
            </div>
            <div class="btn-container">
                <button class="btn btn-confirm" id="confirm-btn">Confirm Order</button>
            </div>
        </div>

        <button class="btn btn-reset" id="reset-btn">Reset All Seats</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // TODO: GANTI isi objek di bawah ini dengan konfigurasi dari Firebase Console Anda sendiri!
        const firebaseConfig = {
            apiKey: "AIzaSyDcCQ4tvGlKN2_GDWtG4P_EYlnSpFQwukM",
            authDomain: "theatertrilogi-643d2.firebaseapp.com",
            databaseURL: "https://theatertrilogi-643d2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "theatertrilogi-643d2",
            storageBucket: "theatertrilogi-643d2.firebasestorage.app",
            messagingSenderId: "419268678381",
            appId: "1:419268678381:web:4a6f0f1c8354542aa4b2e4",
            measurementId: "G-TR7020FWNJ"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const seatsRef = ref(db, 'theaterSeats');

        const rows = 9;
        const colsPerBlock = 4;
        const rowLabels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];

        const blockLeftContainer = document.getElementById('block-left');
        const blockRightContainer = document.getElementById('block-right');
        const selectedCountEl = document.getElementById('selected-count');
        const occupiedCountEl = document.getElementById('occupied-count');
        const confirmBtn = document.getElementById('confirm-btn');
        const resetBtn = document.getElementById('reset-btn');

        let seatData = {};

        function renderTheater() {
            blockLeftContainer.innerHTML = '';
            blockRightContainer.innerHTML = '';

            for (let r = 0; r < rows; r++) {
                const rowName = rowLabels[r];

                for (let c = 1; c <= colsPerBlock; c++) {
                    const seatId = `${rowName}${c}`;
                    blockLeftContainer.appendChild(createSeatElement(seatId));
                }

                for (let c = 5; c <= 8; c++) {
                    const seatId = `${rowName}${c}`;
                    blockRightContainer.appendChild(createSeatElement(seatId));
                }
            }
            updateStats();
        }

        function createSeatElement(seatId) {
            const seat = document.createElement('div');
            seat.classList.add('seat');
            seat.innerText = seatId;
            seat.dataset.id = seatId;

            if (seatData[seatId] === 'occupied') {
                seat.classList.add('occupied');
            } else if (seatData[seatId] === 'selected') {
                seat.classList.add('selected');
            } else {
                seat.classList.add('available');
            }

            seat.addEventListener('click', () => {
                if (seat.classList.contains('occupied')) {
                    Swal.fire({
                        title: 'Cancel Reservation?',
                        text: `Do you want to cancel the reservation for seat ${seatId}?`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#3867d6',
                        cancelButtonColor: '#ff5252',
                        confirmButtonText: 'Yes, cancel it!'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            // Menghapus data kursi spesifik di Firebase
                            remove(ref(db, `theaterSeats/${seatId}`)).then(() => {
                                Swal.fire({
                                    title: 'Cancelled!',
                                    text: `Reservation for ${seatId} has been removed.`,
                                    icon: 'success',
                                    timer: 1500,
                                    showConfirmButton: false
                                });
                            });
                        }
                    });
                }
                else if (seat.classList.contains('selected')) {
                    // Batalkan pilihan (Kembali ke available)
                    remove(ref(db, `theaterSeats/${seatId}`));
                }
                else {
                    // Pilih kursi (Set status menjadi selected di Firebase)
                    set(ref(db, `theaterSeats/${seatId}`), 'selected');
                }
            });

            return seat;
        }

        function updateStats() {
            const selectedSeats = document.querySelectorAll('.seat.selected');
            const documentOccupied = document.querySelectorAll('.seat.occupied');

            selectedCountEl.innerText = selectedSeats.length;
            occupiedCountEl.innerText = documentOccupied.length;
        }

        confirmBtn.addEventListener('click', () => {
            const selectedKeys = Object.keys(seatData).filter(key => seatData[key] === 'selected');

            if (selectedKeys.length === 0) {
                Swal.fire({
                    title: 'No Seats Selected',
                    text: 'Please click and select available seats first!',
                    icon: 'info',
                    confirmButtonColor: '#3867d6'
                });
                return;
            }

            Swal.fire({
                title: 'Confirm Your Order?',
                text: `You are about to reserve ${selectedKeys.length} seat(s): ${selectedKeys.join(', ')}.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#2e7d32',
                cancelButtonColor: '#ff5252',
                confirmButtonText: 'Yes, Confirm Reservation!',
                cancelButtonText: 'No, Go Back'
            }).then((result) => {
                if (result.isConfirmed) {
                    const updates = {};
                    selectedKeys.forEach(id => {
                        updates[id] = 'occupied';
                    });

                    // Update multi-node ke Firebase sekaligus
                    update(seatsRef, updates).then(() => {
                        Swal.fire({
                            title: 'Success!',
                            text: 'Seats successfully reserved!',
                            icon: 'success',
                            confirmButtonColor: '#3867d6'
                        });
                    });
                }
            });
        });

        resetBtn.addEventListener('click', () => {
            Swal.fire({
                title: 'Are you sure?',
                text: "This will reset all seats and clear the Cloud database!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#c62828',
                cancelButtonColor: '#4b6584',
                confirmButtonText: 'Yes, reset all!'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Menghapus seluruh node 'theaterSeats' di Firebase
                    remove(seatsRef).then(() => {
                        Swal.fire({
                            title: 'Reset Completed',
                            text: 'All seats are now available.',
                            icon: 'success',
                            timer: 1500,
                            showConfirmButton: false
                        });
                    });
                }
            });
        });

        // KUNCI REALTIME: Mendengarkan perubahan data di Firebase secara langsung (Realtime listener)
        onValue(seatsRef, (snapshot) => {
            const data = snapshot.val();
            seatData = data || {}; // Jika data kosong/reset, set objek kosong
            renderTheater(); // Render ulang tampilan otomatis setiap ada data baru masuk
        });

    </script>
</body>

</html>
